name: ADR Debate-Refs Check

# Hard lock #4 — push 後最後一道防線（--no-verify / git hook 缺裝都擋不住）。
# 與 .git/hooks/{commit-msg,pre-push} 共用判斷邏輯（見 ~/.claude/git-hooks/adr_debate_refs_git_hook.sh）。
# 部署：~/.claude/git-hooks/install_adr_hooks.sh 自動 cp 此檔到每個 registry repo 的 .github/workflows/

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check_debate_refs:
    name: Verify Debate-Refs ADR ID
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for range diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        shell: bash
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "mode=pr" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            echo "mode=push" >> "$GITHUB_OUTPUT"
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "head=$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Debate-Refs on each commit in range
        shell: bash
        run: |
          set -u
          MODE="${{ steps.range.outputs.mode }}"
          BASE="${{ steps.range.outputs.base }}"
          HEAD="${{ steps.range.outputs.head }}"

          ZERO="0000000000000000000000000000000000000000"

          # 解 first-push（before 全 0）：取 HEAD 上不在其他 ref 的最近 50 commits
          if [ "$BASE" = "$ZERO" ] || [ -z "$BASE" ]; then
            echo "::notice::first-push or new branch → 掃 HEAD 最近 50 commits（不在其他 ref 的）"
            SHAS="$(git log --pretty=%H --not --branches --not --tags "$HEAD" -n 50 2>/dev/null || true)"
          elif [ "$HEAD" = "$ZERO" ]; then
            echo "::notice::branch delete — skip"
            SHAS=""
          else
            SHAS="$(git log --pretty=%H "${BASE}..${HEAD}" 2>/dev/null || true)"
          fi

          if [ -z "$SHAS" ]; then
            echo "::notice::no commits to check"
            exit 0
          fi

          violation=0
          declare -a bad
          for sha in $SHAS; do
            # skip merge commit
            parents="$(git rev-list --parents -n 1 "$sha" 2>/dev/null | awk '{print NF-1}')"
            [ "${parents:-1}" -ge 2 ] && continue

            msg="$(git log -1 --pretty=%B "$sha" 2>/dev/null)"
            first_line="$(echo "$msg" | head -1)"

            # 放行規則（與本機 hook 一致）
            if echo "$msg" | grep -Eq '\[(skip-adr|no-debate)\]'; then continue; fi
            if echo "$first_line" | grep -Eq '^[[:space:]]*\[(docs|chore|style)\]'; then continue; fi
            if echo "$first_line" | grep -Eq '^Merge (branch|pull request)'; then continue; fi
            if echo "$msg" | grep -Eq 'Debate-Refs:[[:space:]]*ADR-[0-9]{6}-[0-9]{2}'; then continue; fi

            violation=1
            short="$(git rev-parse --short "$sha")"
            bad+=("$short  $first_line")
          done

          if [ "$violation" = "1" ]; then
            echo ""
            echo "::error::ADR_DEBATE_REFS_VIOLATION — 以下 commit 缺 Debate-Refs:"
            for line in "${bad[@]}"; do
              echo "  $line"
            done
            cat <<'EOF'

[ADR_DEBATE_REFS_VIOLATION - 憲法 LV0 / GitHub Actions 攔截]

修法：
  git commit -m "subject

  Debate-Refs: ADR-YYMMDD-NN"

或標記：
  [skip-adr] / [no-debate]      # emergency
  [docs] / [chore] / [style]    # 行首小修

ADR 索引：
  ~/.claude/architecture-decisions/
  Obsidian-v.2/08-思想系統 System/Cymon-Memory/ADR/

注意：本檢查無法 --no-verify 繞過。如需緊急 push，請先補 commit message
（可用 git commit --amend 或 git rebase -i 加 Debate-Refs）。
EOF
            exit 1
          fi

          echo "::notice::All commits include Debate-Refs ✅"
