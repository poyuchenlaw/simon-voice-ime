// Verify the delivered ZIP, including a second comparison to the T9 compiler output.
['Debug', 'Release'].each { kind ->
    def variant = "phone${kind}"
    def verifyNative = tasks.register("verifyPhone${kind}NativeLibraries") {
        dependsOn "packagePhone${kind}"
        doLast {
            def apk = file("build/outputs/apk/phone/${kind.toLowerCase()}/app-phone-${kind.toLowerCase()}.apk")
            def built = file("build/intermediates/stripped_native_libs/${variant}/out/lib")
            def sha = { byte[] bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
            def libraries = [:]
            new java.util.zip.ZipFile(apk).withCloseable { zip ->
                def entries = zip.entries().findAll { it.name.startsWith('lib/') && it.name.endsWith('.so') }
                if (entries.empty) throw new GradleException("No native libraries in ${apk}")
                def expected = fileTree(built).matching { include 'arm64-v8a/*.so' }.files.collect { 'lib/' + built.toPath().relativize(it.toPath()).toString() }.toSet()
                if (entries.collect { it.name }.toSet() != expected) throw new GradleException('Native library inventory mismatch')
                entries.each { entry ->
                    if (!entry.name.startsWith('lib/arm64-v8a/')) throw new GradleException("Unexpected phone ABI: ${entry.name}")
                    def actual = zip.getInputStream(entry).withCloseable { sha(it.bytes) }
                    def source = new File(built, entry.name.substring(4))
                    if (actual != sha(source.bytes)) throw new GradleException("Native library mismatch: ${entry.name}")
                    if (entry.name.endsWith('/libzhuyin_t9_core.so')) {
                        source = file('../native/zhuyin_t9_core/target/aarch64-linux-android/release/libzhuyin_t9_core.so')
                        if (actual != sha(source.bytes)) throw new GradleException("Native library mismatch: ${entry.name} vs fresh compiler output")
                    }
                    libraries[entry.name] = [sha256: actual, source: source.toString()]
                }
            }
            def receipt = file("build/reports/native-libraries/${variant}.json")
            receipt.parentFile.mkdirs()
            receipt.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([apk: apk.toString(), apk_sha256: sha(apk.bytes), libraries: libraries])) + '\n'
            logger.lifecycle("Verified ${libraries.size()} packaged native libraries: ${apk}")
        }
    }
    tasks.matching { it.name == "packagePhone${kind}" }.configureEach { finalizedBy verifyNative }
    tasks.matching { it.name == "assemblePhone${kind}" }.configureEach { dependsOn verifyNative }
}
