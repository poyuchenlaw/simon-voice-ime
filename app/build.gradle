plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simon.voiceime'
    compileSdk 34

    defaultConfig {
        applicationId "com.simon.voiceime"
        minSdk 26
        targetSdk 34
        versionCode 69
        versionName "6.32"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    flavorDimensions "device"
    productFlavors {
        phone { dimension "device" }
        watch {
            dimension "device"
            versionCode 72
            versionName "6.35"
            versionNameSuffix "-watch"
            def tokenFile = file("/home/simon/watch-bridge/STT_TOKEN.txt")
            def token = tokenFile.exists() ? tokenFile.text.trim() : "REBUILD_WITH_STT_TOKEN"
            if (!tokenFile.exists()) logger.warn("Watch STT_TOKEN missing: rebuild with token before use")
            buildConfigField "String", "WATCH_STT_TOKEN", groovy.json.JsonOutput.toJson(token)
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword "simonime2026"
            keyAlias "simon-voice-ime"
            keyPassword "simonime2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress 'onnx'
    }

    packagingOptions {
        pickFirst '**/*.so'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    phoneImplementation files('libs/sherpa-onnx-1.12.28.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
