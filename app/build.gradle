    inputs.files(file("../third_party/libchewing/data/dict/chewing/tsi.csv"), file("src/phone/assets/correction/protected_terms.txt"), file("../scripts/build_v633_zhuyin_index.py"))
    outputs.files(file("src/phone/assets/zhuyin_initials.db"), file("src/phone/assets/personal_seed.csv"), file("../evidence/v633/g2pw-unresolved.txt"))
    commandLine "/home/simon/whisper-to-input-proxy/.g2pw_venv/bin/python",
            "scripts/build_v633_zhuyin_index.py"
}
def buildT9RimeSchema = tasks.register("buildT9RimeSchema", Exec) {
    workingDir rootProject.projectDir
    inputs.files(file("src/phone/assets/rime/bopomofo_t9_simon.schema.yaml"),file("src/phone/assets/rime/grammar.yaml"),file("../scripts/build_t9_rime.sh"))
    outputs.files(file("src/phone/assets/rime/build/bopomofo_t9_simon.schema.yaml"),file("src/phone/assets/rime/build/bopomofo_t9_simon.prism.bin"))
