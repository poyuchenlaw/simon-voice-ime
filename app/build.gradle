plugins {
    id 'com.android.application'
}

def phoneVersionCodeValue = rootProject.findProperty("phoneVersionCode")?.toString() ?: "73"
def phoneVersionNameValue = rootProject.findProperty("phoneVersionName")?.toString() ?: "6.36-proto3"

android {
    namespace 'com.simon.voiceime'
    compileSdk 34

    defaultConfig {
        applicationId "com.simon.voiceime"
        minSdk 26
        targetSdk 34
        versionCode 74
        versionName "6.37"
    }

    flavorDimensions "device"
    productFlavors {
        phone {
            dimension "device"
            versionCode phoneVersionCodeValue.toInteger()
            versionName phoneVersionNameValue
            ndk { abiFilters 'arm64-v8a' }
        }
        watch {
            dimension "device"
            versionCode 72
            versionName "6.35"
            versionNameSuffix "-watch"
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            def tokenFile = file("/home/simon/watch-bridge/STT_TOKEN.txt")
            def token = tokenFile.exists() ? tokenFile.text.trim() : "REBUILD_WITH_STT_TOKEN"
            if (!tokenFile.exists()) logger.warn("Watch STT_TOKEN missing: rebuild with token before use")
            buildConfigField "String", "WATCH_STT_TOKEN", groovy.json.JsonOutput.toJson(token)
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword "simonime2026"
            keyAlias "simon-voice-ime"
            keyPassword "simonime2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress 'onnx'
    }

    packagingOptions {
        pickFirst '**/*.so'
    }
}

def buildZhuyinIndex = tasks.register("buildPhoneZhuyinIndex", Exec) {
    workingDir rootProject.projectDir
    inputs.files(file("../third_party/libchewing/data/dict/chewing/tsi.csv"), file("src/phone/assets/correction/protected_terms.txt"), file("../scripts/build_v633_zhuyin_index.py"))
    outputs.files(file("src/phone/assets/zhuyin_initials.db"), file("src/phone/assets/personal_seed.csv"), file("../evidence/v633/g2pw-unresolved.txt"))
    commandLine "/home/simon/whisper-to-input-proxy/.g2pw_venv/bin/python",
            "scripts/build_v633_zhuyin_index.py"
}
def buildPhoneRime = tasks.register("buildPhoneRime", Exec) {
    workingDir rootProject.projectDir
    inputs.files(file("src/phone/cpp/rime_jni.cpp"), file("../evidence/rime_spike/android-prefix/lib/librime.so"), file("../scripts/build_phone_rime_jni.sh"), file("../scripts/prepare_t9_rime_assets.py"))
    outputs.files(file("src/phone/jniLibs/arm64-v8a/librime.so"), file("src/phone/jniLibs/arm64-v8a/librime_jni.so"))
    commandLine "bash", "-c", "python3 scripts/prepare_t9_rime_assets.py && bash scripts/build_phone_rime_jni.sh"
}
tasks.matching { it.name in ["prePhoneDebugBuild", "prePhoneReleaseBuild"] }.configureEach {
    dependsOn buildZhuyinIndex, buildPhoneRime
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    phoneImplementation files('libs/sherpa-onnx-1.12.28.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
