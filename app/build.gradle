plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simon.voiceime'
    compileSdk 34

    defaultConfig {
        applicationId "com.simon.voiceime"
        minSdk 26
        targetSdk 34
        versionCode 46
        versionName "6.10"

        ndk {
            // v6.9: the LLM native runtime (llama.cpp + KleidiAI int4/int8 kernels) is arm64 only.
            // Dropped armeabi-v7a — every modern device (incl. the target Fold6) is arm64-v8a and
            // Google Play already requires 64-bit; building llama.cpp for v7a would add large build
            // cost for zero real-world coverage.
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // NOTE: do NOT pass -fno-rtti — llama.cpp uses dynamic_cast and requires RTTI.
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++17', '-O3'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.5'
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword "simonime2026"
            keyAlias "simon-voice-ime"
            keyPassword "simonime2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'onnx'
    }

    packagingOptions {
        pickFirst '**/*.so'
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.12.28.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
