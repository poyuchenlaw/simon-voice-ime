plugins {
    id 'com.android.application'
}

def phoneVersionCodeValue = rootProject.findProperty("phoneVersionCode")?.toString() ?: "118"
def phoneVersionNameValue = rootProject.findProperty("phoneVersionName")?.toString() ?: "6.82"

android {
    namespace 'com.simon.voiceime'
    compileSdk 34

    defaultConfig {
        applicationId "com.simon.voiceime"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdk 26
        targetSdk 34
        versionCode 74
        versionName "6.37"
    }

    flavorDimensions "device"
    productFlavors {
        phone {
            dimension "device"
            versionCode phoneVersionCodeValue.toInteger()
            versionName phoneVersionNameValue
            ndk { abiFilters 'arm64-v8a' }
        }
        watch {
            dimension "device"
            versionCode 72
            versionName "6.35"
            versionNameSuffix "-watch"
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            def tokenFile = file("/home/simon/watch-bridge/STT_TOKEN.txt")
            def token = tokenFile.exists() ? tokenFile.text.trim() : "REBUILD_WITH_STT_TOKEN"
            if (!tokenFile.exists()) logger.warn("Watch STT_TOKEN missing: rebuild with token before use")
            buildConfigField "String", "WATCH_STT_TOKEN", groovy.json.JsonOutput.toJson(token)
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword "simonime2026"
            keyAlias "simon-voice-ime"
            keyPassword "simonime2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress 'onnx'
    }

    packagingOptions {
        pickFirst '**/*.so'
    }
}

def buildZhuyinIndex = tasks.register("buildPhoneZhuyinIndex", Exec) {
