    dependsOn buildT9RimeSchema
    workingDir rootProject.projectDir
    inputs.files(file("src/phone/cpp/rime_jni.cpp"), fileTree("src/phone/cpp/rime_headers"), file("src/phone/cpp/rime_regroup.h"), file("src/phone/jniLibs/arm64-v8a/librime.so"),
            file("../scripts/build_phone_rime_jni.sh"),
            file("../scripts/check_phone_rime_assets.py"), fileTree("src/phone/assets/rime") { include "*.schema.yaml", "*.yaml", "*.gram" })
    outputs.files(file("src/phone/jniLibs/arm64-v8a/librime.so"), file("src/phone/jniLibs/arm64-v8a/librime_jni.so"),
            file("src/phone/assets/rime/build/bopomofo_express.schema.yaml"))
    commandLine "bash", "-c", "python3 scripts/check_phone_rime_assets.py --compiled-only && bash scripts/build_phone_rime_jni.sh"
}
def ndkRoot = System.getenv("ANDROID_NDK_HOME") ?: "/home/simon/android-sdk/ndk/26.3.11579264"
def buildPhoneChewingJni = tasks.register("buildPhoneChewingJni", Exec) {
    workingDir rootProject.projectDir
    inputs.files(file("src/phone/cpp/chewing_jni.c"), file("src/phone/jniLibs/arm64-v8a/libchewing.so"))
    outputs.file(file("src/phone/jniLibs/arm64-v8a/libchewing_jni.so"))
    commandLine "bash", "-c", "set -euo pipefail; LLVM='${ndkRoot}/toolchains/llvm/prebuilt/linux-x86_64/bin'; \"\$LLVM/aarch64-linux-android26-clang\" -shared -fPIC -O2 -Wl,-z,max-page-size=16384 -Wl,-soname,libchewing_jni.so -I'${ndkRoot}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include' -I'${rootProject.projectDir}/third_party/libchewing/capi/include' '${rootProject.projectDir}/app/src/phone/cpp/chewing_jni.c' -L'${rootProject.projectDir}/app/src/phone/jniLibs/arm64-v8a' -lchewing -o '${rootProject.projectDir}/app/src/phone/jniLibs/arm64-v8a/libchewing_jni.so';"
}
tasks.matching { it.name in ["prePhoneDebugBuild", "prePhoneReleaseBuild"] }.configureEach {
    dependsOn buildZhuyinIndex, buildPhoneRime, buildPhoneChewingJni
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    phoneImplementation files('libs/sherpa-onnx-1.12.28.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

def buildPhoneT9 = tasks.register("buildPhoneT9", Exec) {
    workingDir rootProject.projectDir
    inputs.files(fileTree("../native/zhuyin_t9_core") { exclude "target/**" },file("../scripts/build_t9_core.sh"),file("src/phone/assets/zhuyin_initials.db"),file("src/phone/assets/rime/build/terra_pinyin.table.bin"))
    outputs.files(file("src/phone/jniLibs/arm64-v8a/libzhuyin_t9_core.so"),file("src/phone/jniLibs/x86_64/libzhuyin_t9_core.so"))
