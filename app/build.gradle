plugins {
    id 'com.android.application'
}

def phoneVersionCodeValue = rootProject.findProperty("phoneVersionCode")?.toString() ?: "89"
def phoneVersionNameValue = rootProject.findProperty("phoneVersionName")?.toString() ?: "6.54"

android {
    namespace 'com.simon.voiceime'
    compileSdk 34

    defaultConfig {
        applicationId "com.simon.voiceime"
        minSdk 26
        targetSdk 34
        versionCode 74
        versionName "6.37"
    }

    flavorDimensions "device"
    productFlavors {
        phone {
            dimension "device"
            versionCode phoneVersionCodeValue.toInteger()
            versionName phoneVersionNameValue
            ndk { abiFilters 'arm64-v8a' }
        }
        watch {
            dimension "device"
            versionCode 72
            versionName "6.35"
            versionNameSuffix "-watch"
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            def tokenFile = file("/home/simon/watch-bridge/STT_TOKEN.txt")
            def token = tokenFile.exists() ? tokenFile.text.trim() : "REBUILD_WITH_STT_TOKEN"
            if (!tokenFile.exists()) logger.warn("Watch STT_TOKEN missing: rebuild with token before use")
            buildConfigField "String", "WATCH_STT_TOKEN", groovy.json.JsonOutput.toJson(token)
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword "simonime2026"
            keyAlias "simon-voice-ime"
            keyPassword "simonime2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress 'onnx'
    }

    packagingOptions {
        pickFirst '**/*.so'
    }
}

def buildZhuyinIndex = tasks.register("buildPhoneZhuyinIndex", Exec) {
    workingDir rootProject.projectDir
    inputs.files(file("../third_party/libchewing/data/dict/chewing/tsi.csv"), file("src/phone/assets/correction/protected_terms.txt"), file("../scripts/build_v633_zhuyin_index.py"))
    outputs.files(file("src/phone/assets/zhuyin_initials.db"), file("src/phone/assets/personal_seed.csv"), file("../evidence/v633/g2pw-unresolved.txt"))
    commandLine "/home/simon/whisper-to-input-proxy/.g2pw_venv/bin/python",
            "scripts/build_v633_zhuyin_index.py"
}
def buildPhoneRime = tasks.register("buildPhoneRime", Exec) {
    workingDir rootProject.projectDir
    inputs.files(file("src/phone/cpp/rime_jni.cpp"), fileTree("src/phone/cpp/rime_headers"), file("src/phone/cpp/rime_regroup.h"), file("../evidence/rime_spike/android-prefix/lib/librime.so"),
            file("../scripts/build_phone_rime_jni.sh"),
            file("../scripts/check_phone_rime_assets.py"), fileTree("src/phone/assets/rime") { include "*.schema.yaml", "*.yaml", "*.gram" })
    outputs.files(file("src/phone/jniLibs/arm64-v8a/librime.so"), file("src/phone/jniLibs/arm64-v8a/librime_jni.so"),
            file("src/phone/assets/rime/build/bopomofo_express.schema.yaml"))
    commandLine "bash", "-c", "python3 scripts/check_phone_rime_assets.py && bash scripts/build_phone_rime_jni.sh"
}
def ndkRoot = System.getenv("ANDROID_NDK_HOME") ?: "/home/simon/android-sdk/ndk/26.3.11579264"
def buildPhoneChewingJni = tasks.register("buildPhoneChewingJni", Exec) {
    workingDir rootProject.projectDir
    inputs.files(file("src/phone/cpp/chewing_jni.c"), file("src/phone/jniLibs/arm64-v8a/libchewing.so"))
    outputs.file(file("src/phone/jniLibs/arm64-v8a/libchewing_jni.so"))
    commandLine "bash", "-c", "set -euo pipefail; LLVM='${ndkRoot}/toolchains/llvm/prebuilt/linux-x86_64/bin'; \"\$LLVM/aarch64-linux-android26-clang\" -shared -fPIC -O2 -Wl,-z,max-page-size=16384 -Wl,-soname,libchewing_jni.so -I'${ndkRoot}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include' -I'${rootProject.projectDir}/third_party/libchewing/capi/include' '${rootProject.projectDir}/app/src/phone/cpp/chewing_jni.c' -L'${rootProject.projectDir}/app/src/phone/jniLibs/arm64-v8a' -lchewing -o '${rootProject.projectDir}/app/src/phone/jniLibs/arm64-v8a/libchewing_jni.so';"
}
tasks.matching { it.name in ["prePhoneDebugBuild", "prePhoneReleaseBuild"] }.configureEach {
    dependsOn buildZhuyinIndex, buildPhoneRime, buildPhoneChewingJni
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    phoneImplementation files('libs/sherpa-onnx-1.12.28.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
